<title>PhoneSpot Kundecenter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: mapper | samtaleliste | tråd | kundekort. Én rude ad gangen på telefon. Admin'ens lyse flade, ét udtryk. */
:root{
  --shell:#F5F6F4; --surface:#FFFFFF; --text:#15211B; --muted:#5E6A63; --faint:#8A948D;
  --line:#E2E5E0; --control:#C9D0C7; --green:#1A3D2E; --green-hover:#2D6B45; --green-pale:#E7EFE9;
  --ready:#2F8F55; --warn:#8A4B08; --warn-bg:#FFF4E5; --err:#B42318; --err-bg:#FDECEC;
  --note:#FFF8DB; --note-line:#EBDD9A; --fiks:#F1F6F2;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--shell);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{height:52px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px}
.brand{font-weight:700;font-size:18px;color:var(--green)}
.top h1{font-size:16px;font-weight:600;margin:0}
.demo{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--shell);white-space:nowrap}
.keys{font-size:12px;color:var(--muted);border:1px solid var(--control);background:var(--surface);border-radius:8px;height:30px;padding:0 10px}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:204px 340px minmax(0,1fr) 296px}
.pane{min-height:0;min-width:0;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line)}
/* mapper */
.views{background:var(--shell);padding:14px 10px}
.views h2{font-size:12px;font-weight:500;color:var(--muted);margin:14px 10px 6px}
.views h2:first-child{margin-top:2px}
.view{width:100%;height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;border:0;background:transparent;border-radius:8px;text-align:left}
.view:hover{background:#ECEEEA}
.view[aria-current="true"]{background:var(--green-pale);color:var(--green);font-weight:600}
.count{font-size:12px;font-variant-numeric:tabular-nums;font-weight:600;min-width:20px;text-align:center;padding:1px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.count.hot{background:var(--err-bg);border-color:transparent;color:var(--err)}
/* liste */
.listhead{position:sticky;top:0;background:var(--surface);z-index:2;padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.listhead .row{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;height:36px;border:1px solid var(--control);border-radius:8px;padding:0 10px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--control);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 10px;border:0;background:var(--surface);font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--green-pale);color:var(--green);font-weight:600}
.viewpick{display:none;height:36px;border:1px solid var(--control);border-radius:8px;padding:0 8px;background:var(--surface);flex:1;min-width:0}
.sorted{font-size:12px;color:var(--muted)}
.item{width:100%;display:block;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:11px 14px 12px;position:relative}
.item:hover{background:#FAFBF9}
.item[aria-current="true"]{background:var(--green-pale)}
.item[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.item .l1{display:flex;align-items:baseline;gap:8px}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.item.unread .name::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:middle}
.wait{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wait.long{color:var(--warn);font-weight:600}
.item .subj{font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .prev{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}
.tag{font-size:11.5px;line-height:1;padding:4px 7px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.tag.me{background:var(--green);border-color:var(--green);color:#fff}
.tag.need{background:var(--err-bg);border-color:transparent;color:var(--err);font-weight:600}
.tag.fiks{background:var(--fiks);border-color:#CFE0D4;color:var(--green)}
.tag.public{background:var(--warn-bg);border-color:transparent;color:var(--warn);font-weight:600}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
/* tråd */
.thread{display:flex;flex-direction:column;overflow:hidden}
.thead{flex:none;padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thead .ttl{flex:1;min-width:160px}
.thead .ttl b{display:block;font-size:16px;font-weight:600}
.thead .ttl span{font-size:13px;color:var(--muted)}
.btn{height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--control);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-hover);border-color:var(--green-hover)}
.btn.small{height:30px;padding:0 10px;font-size:12.5px;font-weight:500}
.btn.back,.btn.cust{display:none}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--shell)}
.msg{max-width:min(620px,88%);border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 13px}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap}
.msg .who b{color:var(--text);font-weight:600}
.msg p{margin:0;white-space:pre-wrap}
.msg.out{align-self:flex-end;background:var(--green-pale);border-color:#D3E2D8}
.msg.fiks{align-self:flex-end;background:var(--fiks);border:1px dashed #9DBBA8}
.msg.fiks .who b{color:var(--green)}
.msg .src{margin-top:7px;font-size:12px;color:var(--muted);border-top:1px solid #D9E5DD;padding-top:6px}
.msg.note{align-self:stretch;max-width:none;background:var(--note);border-color:var(--note-line)}
.sys{align-self:center;font-size:12.5px;color:var(--muted);text-align:center;max-width:520px}
.sys b{color:var(--err);font-weight:600}
.stars{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
.audit{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.audit span{flex:1;min-width:180px}
.audit textarea{flex:1 1 100%}
.composer{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:12px 18px 14px;display:flex;flex-direction:column;gap:9px}
.composer.noting{background:var(--note)}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.draftinfo{font-size:12.5px;color:var(--green);background:var(--fiks);border:1px solid #CFE0D4;border-radius:8px;padding:6px 10px}
.publicwarn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px;font-weight:500}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--control);border-radius:8px;padding:10px 12px;background:var(--surface);font-size:15px;line-height:1.45}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted)}
select.btn{font-weight:500;padding-right:6px}
/* kundekort */
.cust{padding:16px;border-right:0}
.cust h3{font-size:16px;font-weight:600;margin:0 0 2px}
.cust .sub{color:var(--muted);font-size:13px}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.sec h4{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 7px}
.card{display:block;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:var(--surface)}
.card b{font-weight:600;display:block}
.card span{font-size:12.5px;color:var(--muted)}
.card .st{color:var(--ready);font-weight:600}
.anon{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-top:10px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
/* toast + hjælp */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:#fff;border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
.toast button{background:transparent;border:1px solid #5E6A63;color:#fff;border-radius:8px;height:30px;padding:0 10px;font-weight:600;font-variant-numeric:tabular-nums}
.help{position:fixed;inset:0;background:rgba(21,33,27,.35);display:grid;place-items:center;z-index:40;padding:16px}
.help div{background:var(--surface);border-radius:12px;padding:18px 20px;max-width:360px;width:100%}
.help h3{margin:0 0 10px;font-size:16px}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0 0 14px}
.help dt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid var(--control);border-radius:6px;padding:1px 7px;text-align:center}
.help dd{margin:0}
@media (max-width:1240px){
  .panes{grid-template-columns:204px 320px minmax(0,1fr)}
  .cust{position:fixed;right:0;top:52px;bottom:0;width:min(320px,100%);border-left:1px solid var(--line);z-index:20;display:none}
  .app.showcust .cust{display:block}
  .btn.cust{display:inline-block}
}
@media (max-width:900px){
  .panes{grid-template-columns:minmax(0,1fr)}
  .views{display:none}
  .viewpick{display:block}
  .app[data-pane="list"] .thread{display:none}
  .app[data-pane="thread"] .list{display:none}
  .btn.back{display:inline-block}
  .keys,.top h1{display:none}
  .msgs,.thead,.composer,.audit{padding-left:16px;padding-right:16px}
  .btn{height:40px}
}
@media (prefers-reduced-motion:no-preference){.item,.view,.btn{transition:background-color .12s,border-color .12s}}
</style>

<div class="app" id="app" data-pane="list">
  <header class="top">
    <span class="brand">PhoneSpot</span>
    <h1>Kundecenter</h1>
    <span class="demo">Udkast med eksempeldata</span>
    <button class="keys" id="helpBtn" type="button">Genveje</button>
  </header>
  <div class="panes">
    <nav class="pane views" id="views" aria-label="Visninger"></nav>
    <section class="pane list" aria-label="Samtaler">
      <div class="listhead">
        <div class="row">
          <select class="viewpick" id="viewpick" aria-label="Visning"></select>
          <input class="search" id="q" type="search" placeholder="Søg navn, telefon, tekst" aria-label="Søg i samtaler">
        </div>
        <div class="row">
          <div class="seg" id="store" role="group" aria-label="Butik"></div>
          <span class="spacer"></span><span class="sorted">Længst ventende øverst</span>
        </div>
      </div>
      <div id="list"></div>
    </section>
    <section class="pane thread" id="thread" aria-label="Samtale"></section>
    <aside class="pane cust" id="cust" aria-label="Kunde"></aside>
  </div>
</div>
<div id="toast"></div>
<div id="help"></div>

<script>

const VIEWS = [

  {id:"unassigned", label:"Ikke tildelt", count:true, f:c=>c.status==="open"&&!c.owner&&!c.fiksDone},
  {id:"need", label:"Kræver dig", count:true, hot:true, f:c=>c.status==="open"&&c.need},
  {id:"waiting", label:"Venter på kunden", f:c=>c.status==="waiting"},
  {id:"snoozed", label:"Udsat", f:c=>c.status==="snoozed"},

  {id:"done", label:"Færdig", f:c=>c.status==="done"},

  {id:"ch-chat", label:"Chat på sitet", f:c=>c.ch==="Chat"&&c.status!=="done"},
  {id:"ch-msg", label:"Messenger", f:c=>c.ch==="Messenger"&&c.status!=="done"},
  {id:"ch-sms", label:"SMS", f:c=>c.ch==="SMS"&&c.status!=="done"},
  {id:"ch-form", label:"Formular og opkøb", f:c=>c.ch==="Formular"&&c.status!=="done"},
  {id:"ch-rev", label:"Anmeldelser", f:c=>c.public&&c.status!=="done"},
];
const SAVED = [
  ["Åbningstider Vejle","Vi har åbent mandag til fredag 10–18 og lørdag 10–15 i Vejle. Du er velkommen uden aftale."],
  ["Klar til afhentning","Din {enhed} er klar til afhentning i {butik}. Husk din kvittering eller det telefonnummer, sagen er oprettet på."],
  ["Mangler model","Tak for din besked. Hvilken model drejer det sig om? Du finder den under Indstillinger, Generelt, Om."],
];
const C = [
 {id:1, name:"Camilla Holm", ch:"Mail", box:"info@", store:"Vejle", subj:"Skærmen er sort, men den ringer", wait:"3 t 10 min", long:true, unread:true, status:"open", owner:null,
  msgs:[{t:"in",who:"Camilla Holm",when:"i dag 08.42",body:"Hej. Min iPhone 13 blev tabt i går. Skærmen er helt sort, men den ringer stadig og vibrerer. Kan det laves, og hvad koster det? Jeg bor i Vejle."}],
  draft:{text:"Det lyder som selve skærmen, der er gået, når telefonen stadig ringer og vibrerer. Det kan vi lave, mens du venter.\n\nSkærmskift på iPhone 13 koster lige nu 1.169 kr. i OEM-kvalitet og 1.799 kr. i original kvalitet. Det er kampagnepriser i november. Det tager ca. 45 minutter, og der er livstidsgaranti på reparationen.\n\nDu kan komme ind uden aftale i Vejle eller booke en tid på phonespot.dk/reparation.\n\nVenlig hilsen",
    short:"Det er sandsynligvis skærmen. Skærmskift på iPhone 13 koster 1.169 kr. (OEM) eller 1.799 kr. (original) i november, tager ca. 45 minutter og har livstidsgaranti. Kom ind uden aftale i Vejle, eller book på phonespot.dk/reparation.\n\nVenlig hilsen",
    src:"Bygger på: symptom “sort skærm, telefonen reagerer” og prisopslag iPhone 13, Skærmskift"},
  cust:{known:true, mail:"camilla.holm@eksempel.dk", tel:"20 12 34 56", since:"Kunde siden marts 2025", orders:[["Ordre PS-10311","iPhone 13 128 GB, leveret 14. marts 2025"]], repairs:[], prev:["Spørgsmål om cover, besvaret 2. april 2025"]}},
 {id:2, name:"Besøgende på sitet", ch:"Chat", store:"Generel", subj:"Klage over batteriskift", wait:"48 min", unread:true, status:"open", owner:null, need:"Kunden klager over en reparation",
  msgs:[{t:"in",who:"Besøgende",when:"i dag 11.04",body:"Jeg fik skiftet batteri hos jer i Slagelse for 3 uger siden og den holder stadig kun en halv dag. Det er simpelthen ikke godt nok."},
   {t:"fiks",who:"Fiks",when:"11.04",body:"Det er jeg ked af at høre. Det skal en af mine kolleger se på, så du får et ordentligt svar. Må jeg få dit navn og et telefonnummer eller en mail, så vender vi tilbage i dag?"},
   {t:"in",who:"Besøgende",when:"11.06",body:"Peter Lund, 31 22 33 44"},
   {t:"sys",body:"Fiks gav sagen videre. <b>Grund: kunden klager over en reparation.</b> Fiks svarer ikke mere i denne samtale."}],
  cust:{known:true, mail:"", tel:"31 22 33 44", since:"Fundet på telefonnummer", repairs:[["Batteriskift iPhone 12","Slagelse, afsluttet 29. oktober, 6 mdr. garanti","Afsluttet"]], orders:[], prev:[]}},
 {id:3, name:"Mads K.", ch:"Messenger", store:"Generel", subj:"Hvad giver I for en iPhone 14?", wait:"besvaret", status:"open", owner:null, fiksDone:true,
  msgs:[{t:"in",who:"Mads K.",when:"i dag 10.15",body:"Hej hvad giver i for en iphone 14 128gb? Den fejler ikke noget, lidt ridser på bagsiden"},
   {t:"fiks",who:"Fiks",when:"10.15",body:"Hej Mads. For en iPhone 14 med 128 GB i den stand er vores vejledende pris 2.400 kr. Den endelige pris får du, når vi har set telefonen.\n\nVil du have et bindende tilbud, kan du udfylde formularen på phonespot.dk/saelg-din-enhed, så svarer vi inden for 24 timer. Du kan også komme forbi i Vejle eller Slagelse og få pengene samme dag.",src:"Bygger på: vejledende opkøbspris iPhone 14, 128 GB, ridset bagside"},
   {t:"in",who:"Mads K.",when:"10.17",body:"Fedt tak, jeg kommer forbi lørdag"}],
  cust:{known:false}},
 {id:4, name:"Google-anmeldelse", ch:"Google", store:"Vejle", public:true, subj:"2 af 5 fra Thomas R.", wait:"5 t", long:true, status:"open", owner:null,
  msgs:[{t:"in",who:"Thomas R.",when:"i dag 06.50",stars:"2 af 5",body:"Ventede 25 minutter selvom jeg havde booket tid. Reparationen var fin nok, men det er ikke okay at stå og vente så længe."}],
  draft:{text:"Tak for din anmeldelse, Thomas. Du skal ikke vente 25 minutter, når du har booket en tid, og det beklager vi. Vi vil gerne høre, hvilken dag det var, så vi kan se, hvad der gik galt. Skriv til os på info@phonespot.dk, eller kig forbi butikken.\n\nVenlig hilsen PhoneSpot Vejle",
    short:"Tak for din anmeldelse, Thomas. Vi beklager ventetiden, når du havde booket tid. Skriv gerne til info@phonespot.dk, så vi kan se, hvad der gik galt.\n\nVenlig hilsen PhoneSpot Vejle",
    src:"Offentligt svar. Sendes aldrig uden et ja fra en medarbejder."},
  cust:{known:false, review:true}},
 {id:5, name:"Jonas Bech", ch:"Mail", box:"info@", store:"Generel", subj:"Hvor er min ordre PS-10482?", wait:"1 t 20 min", status:"open", owner:ME,
  msgs:[{t:"in",who:"Jonas Bech",when:"i dag 10.30",body:"Hej, jeg bestilte en iPad i mandags og har ikke hørt noget. Ordrenummer PS-10482."}],
  draft:{text:"Din ordre PS-10482 blev sendt i går med PostNord og ligger nu på vej til din pakkeshop. Sporingsnummeret er 00370712345678901234, og du får en sms fra PostNord, når pakken kan hentes. Det plejer at tage 1 til 3 hverdage.\n\nVenlig hilsen",

  cust:{known:true, mail:"jonas.bech@eksempel.dk", tel:"", since:"Kunde siden november 2026", orders:[["Ordre PS-10482","iPad 10. gen 64 GB, afsendt 18. november","Afsendt"]], repairs:[], prev:[]}},
 {id:6, name:"Nordvang Skole", ch:"Formular", store:"Slagelse", subj:"Erhverv: 12 iPads med revnet skærm", wait:"2 t 5 min", status:"open", owner:"Sara",

   {t:"note",who:"Sara",when:"09.55",body:"Jeg ringer til dem efter frokost. @Dig: må vi give mængderabat ud over de 15 %?"}],
  cust:{known:true, mail:"lene.dahl@eksempel.dk", tel:"58 12 34 56", since:"Ny erhvervskunde", orders:[], repairs:[], prev:[]}},
 {id:7, name:"Aisha N.", ch:"SMS", store:"Vejle", subj:"Reparation klar", wait:"i går", status:"waiting", owner:ME,
  msgs:[{t:"out",who:"Dig",when:"i går 15.10",body:"Hej Aisha. Din Samsung S23 er klar til afhentning i Vejle. Vi har åbent til 18 i dag."}],
  cust:{known:true, mail:"", tel:"42 11 22 33", since:"Kunde siden 2024", repairs:[["Skærmskift Galaxy S23","Vejle, klar til afhentning","Klar"]], orders:[], prev:["Batteriskift iPhone 11, 2024"]}},
 {id:8, name:"Trustpilot-anmeldelse", ch:"Trustpilot", store:"Slagelse", public:true, subj:"5 af 5 fra Mette S.", wait:"i går", status:"open", owner:null,
  msgs:[{t:"in",who:"Mette S.",when:"i går 19.12",stars:"5 af 5",body:"Hurtig og venlig betjening i Slagelse. Fik ny skærm på en halv time."}],
  draft:{text:"Tak for de pæne ord, Mette. Det er vi glade for at høre, og vi giver det videre til holdet i Slagelse.\n\nVenlig hilsen PhoneSpot Slagelse", short:"Tak, Mette. Det giver vi videre til holdet i Slagelse.\n\nVenlig hilsen PhoneSpot Slagelse", src:"Offentligt svar. Indsættes hos Trustpilot via linket."},
  cust:{known:false, review:true}},
 {id:9, name:"Frederik Winther", ch:"Formular", store:"Vejle", subj:"Sælg enhed: MacBook Air M2", wait:"mandag", status:"snoozed", owner:ME,
  msgs:[{t:"in",who:"Frederik Winther",when:"mandag 13.20",body:"MacBook Air M2 2022, 8/256 GB, pæn stand, 91 % batteri."},
   {t:"out",who:"Dig",when:"mandag 14.05",body:"Tak, Frederik. Vi kan tilbyde 3.900 kr. Tilbuddet gælder i 7 dage."},
   {t:"sys",body:"Udsat til fredag kl. 9. Kommer tilbage i Mine, hvis kunden ikke har svaret."}],
  cust:{known:true, mail:"frederik.w@eksempel.dk", tel:"26 55 44 33", since:"Ny kunde", orders:[], repairs:[], buyback:[["Opkøb MacBook Air M2","Tilbud 3.900 kr. sendt mandag","Venter"]], prev:[]}},
];
let view="unassigned", store="Alle", sel=null, q="", mode="reply", undo=null;
const $=id=>document.getElementById(id), app=$("app");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const visible=()=>C.filter(VIEWS.find(v=>v.id===view).f).filter(c=>store==="Alle"||c.store===store).filter(c=>!q||(c.name+c.subj+c.msgs.map(m=>m.body).join(" ")+(c.cust.tel||"")).toLowerCase().includes(q));

function renderViews(){
  $("views").innerHTML=VIEWS.map(v=>{const n=C.filter(v.f).length;
    return (v.g?`<h2>${v.g}</h2>`:"")+`<button class="view" type="button" data-v="${v.id}" aria-current="${v.id===view}"><span>${v.label}</span>${v.count&&n?`<span class="count${v.hot?" hot":""}">${n}</span>`:""}</button>`}).join("");
  $("viewpick").innerHTML=VIEWS.map(v=>`<option value="${v.id}"${v.id===view?" selected":""}>${v.label}${v.count?" ("+C.filter(v.f).length+")":""}</option>`).join("");
  $("store").innerHTML=["Alle","Vejle","Slagelse"].map(s=>`<button type="button" data-s="${s}" aria-pressed="${s===store}">${s}</button>`).join("");
}
function renderList(){
  const rows=visible();
  if(!rows.length){$("list").innerHTML=`<div class="empty"><strong>Ingen sager her</strong>Ældste svar i dag tog 12 minutter.</div>`;return}
  $("list").innerHTML=rows.map(c=>{const last=c.msgs.filter(m=>m.t!=="sys").slice(-1)[0];
    return `<button type="button" class="item${c.unread?" unread":""}" data-id="${c.id}" aria-current="${sel===c.id}">
      <div class="l1"><span class="name">${esc(c.name)}</span><span class="wait${c.long?" long":""}">${c.wait}</span></div>
      <div class="subj">${esc(c.subj)}</div><div class="prev">${esc(last.body)}</div>
      <div class="tags"><span class="tag">${c.ch}${c.box?" · "+c.box:""}</span>${c.store!=="Generel"?`<span class="tag">${c.store}</span>`:""}
      ${c.public?`<span class="tag public">Offentlig</span>`:""}${c.need?`<span class="tag need">Kræver dig</span>`:""}${c.fiksDone?`<span class="tag fiks">Besvaret af Fiks</span>`:""}
      ${c.draft&&!c.public?`<span class="tag fiks">Udkast klar</span>`:""}${c.owner?`<span class="tag${c.owner===ME?" me":""}">${c.owner===ME?"Min":c.owner}</span>`:""}</div></button>`}).join("");
}
function renderThread(){
  const c=C.find(x=>x.id===sel), el=$("thread");
  if(!c){el.innerHTML=`<div class="empty" style="margin:auto"><strong>Vælg en samtale</strong>J og K flytter op og ned i listen.</div>`;$("cust").innerHTML="";return}
  const msgs=c.msgs.map(m=>m.t==="sys"?`<div class="sys">${m.body}</div>`:
    `<div class="msg ${m.t==="out"?"out":m.t==="fiks"?"fiks":m.t==="note"?"note":""}"><div class="who"><b>${esc(m.who)}</b>${m.t==="fiks"?"<span>automatisk svar</span>":m.t==="note"?"<span>intern note, kunden ser den ikke</span>":""}${m.stars?`<span class="stars">${m.stars}</span>`:""}<span>${m.when}</span></div><p>${esc(m.body)}</p>${m.src?`<div class="src">${esc(m.src)}</div>`:""}</div>`).join("");
  const chans=c.public?"":`<select class="btn small" id="chan" aria-label="Svar via">${(c.ch==="Mail"||c.ch==="Formular"?["Mail fra "+(c.box||"info@"),"SMS"]:c.ch==="SMS"?["SMS","Mail"]:[c.ch,"SMS","Mail"]).filter(x=>!(x==="SMS"&&!c.cust.tel)&&!(x==="Mail"&&!c.cust.mail)).map(x=>`<option>${x}</option>`).join("")}</select>`;
  const audit=c.fiksDone&&!c.audited?`<div class="audit" id="audit"><span>Fiks svarede selv. Var svaret rigtigt?</span><button class="btn small" data-a="ok" type="button">Korrekt</button><button class="btn small" data-a="bad" type="button">Forkert</button></div>`:c.audited?`<div class="audit"><span class="hint">${c.audited}</span></div>`:"";
  el.innerHTML=`<div class="thead"><button class="btn small back" data-a="back" type="button">Tilbage</button>
    <div class="ttl"><b>${esc(c.subj)}</b><span>${esc(c.name)} · ${c.ch}${c.owner?` · ${c.owner===ME?"din sag":"hos "+c.owner}`:" · ikke tildelt"}</span></div>
    ${c.owner===ME?"":`<button class="btn small primary" data-a="take" type="button">Tag den</button>`}
    <button class="btn small" data-a="snooze" type="button">Udsæt</button><button class="btn small" data-a="done" type="button">Færdig</button>
    <button class="btn small cust" data-a="cust" type="button">Kunde</button></div>
   <div class="msgs" id="msgs">${msgs}</div>${audit}
   ${c.status==="done"?"":`<div class="composer${mode==="note"?" noting":""}" id="composer">
    <div class="crow"><div class="seg"><button type="button" data-m="reply" aria-pressed="${mode==="reply"}">${c.public?"Svar offentligt":"Svar"}</button><button type="button" data-m="note" aria-pressed="${mode==="note"}">Intern note</button></div>
      ${mode==="reply"?chans:""}<span class="spacer"></span>
      ${mode==="reply"?`<select class="btn small" id="saved" aria-label="Gemte svar"><option value="">Gemte svar</option>${SAVED.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join("")}</select>`:""}</div>
    ${mode==="reply"&&c.public?`<div class="publicwarn">Dette svar bliver offentligt hos ${c.ch}. Skriv ikke telefonnumre, ordrenumre eller andet om kunden.</div>`:""}
    ${mode==="reply"&&c.draft?`<div class="draftinfo">Udkast fra Fiks, ikke sendt. ${esc(c.draft.src)}</div>`:""}
    <textarea id="body" aria-label="${mode==="note"?"Intern note":"Svar"}" placeholder="${mode==="note"?"Skriv en note til kollegerne. Brug @ for at nævne en kollega.":"Skriv et svar"}">${mode==="reply"&&c.draft?esc(c.draft.text):""}</textarea>
    <div class="crow">${mode==="reply"&&c.draft?`<button class="btn small" data-a="short" type="button">Kortere</button><button class="btn small" data-a="full" type="button">Oprindeligt udkast</button>`:""}
      <span class="spacer"></span>
      ${mode==="note"?`<button class="btn primary" data-a="note" type="button">Gem note</button>`:
       `<button class="btn" data-a="sendwait" type="button">Send og vent på kunden</button><button class="btn primary" data-a="senddone" type="button">Send og luk</button>`}</div></div>`}`;
  const m=$("msgs"); m.scrollTop=m.scrollHeight; renderCust(c);
}
function renderCust(c){
  const k=c.cust, list=(t,a)=>a&&a.length?`<div class="sec"><h4>${t}</h4>${a.map(r=>Array.isArray(r)?`<div class="card"><b>${esc(r[0])}</b><span>${esc(r[1])}</span>${r[2]?` <span class="st">· ${r[2]}</span>`:""}</div>`:`<div class="card"><span>${esc(r)}</span></div>`).join("")}</div>`:"";
  $("cust").innerHTML=k.review?`<h3>Offentlig anmeldelse</h3><div class="sub">${c.ch} · ${c.store}</div><div class="anon">Anmeldelser kobles ikke til en kunde. Svaret kan læses af alle.</div>`:
   !k.known?`<h3>${esc(c.name)}</h3><div class="sub">${c.ch}</div><div class="anon">Ikke identificeret. Fiks giver ikke ordre- eller sagsoplysninger i denne samtale. Bed om mail eller telefon for at koble kunden.</div>`:
   `<h3>${esc(c.name)}</h3><div class="sub">${esc(k.since)}</div><dl class="kv">${k.mail?`<dt>Mail</dt><dd>${esc(k.mail)}</dd>`:""}${k.tel?`<dt>Telefon</dt><dd>${esc(k.tel)}</dd>`:""}<dt>Butik</dt><dd>${c.store}</dd></dl>
    ${list("Reparationer",k.repairs)}${list("Ordrer",k.orders)}${list("Opkøb",k.buyback)}${list("Tidligere samtaler",k.prev)}
    <div class="sec"><h4>Notat om kunden</h4><textarea id="custnote" style="min-height:64px;font-size:14px" aria-label="Notat om kunden" placeholder="Fx: ringer helst efter kl. 16"></textarea></div>`;
}
function render(){renderViews();renderList();renderThread()}
function open(id){sel=id;mode="reply";const c=C.find(x=>x.id===id);if(c)c.unread=false;app.dataset.pane="thread";app.classList.remove("showcust");render()}
function next(){const r=visible();sel=r.length?r[0].id:null;if(!sel)app.dataset.pane="list"}
function toast(text,onUndo){
  clearInterval(undo);let s=10;const t=$("toast");
  const draw=()=>t.innerHTML=`<div class="toast" role="status"><span>${esc(text)}</span>${onUndo?`<button type="button" id="undoBtn">Fortryd (${s})</button>`:""}</div>`;
  draw();undo=setInterval(()=>{s--;if(s<=0){clearInterval(undo);t.innerHTML=""}else if(onUndo)draw()},1000);
  t.onclick=e=>{if(e.target.id==="undoBtn"){clearInterval(undo);t.innerHTML="";onUndo();render()}};
}
function act(a){
  const c=C.find(x=>x.id===sel); if(a==="back"){app.dataset.pane="list";return} if(!c)return;
  const snap={status:c.status,owner:c.owner,need:c.need,fiksDone:c.fiksDone,len:c.msgs.length,draft:c.draft}, back=()=>{c.msgs.length=snap.len;Object.assign(c,snap);sel=c.id};
  const text=$("body")?$("body").value.trim():"";
  if(a==="cust"){app.classList.toggle("showcust");return}
  if(a==="take"){c.owner=ME;render();toast("Sagen er din.");return}
  if(a==="short"&&c.draft){$("body").value=c.draft.short;return}
  if(a==="full"&&c.draft){$("body").value=c.draft.text;return}
  if(a==="note"){if(!text)return;c.msgs.push({t:"note",who:ME,when:"nu",body:text});mode="reply";render();return}
  if(a==="ok"){c.audited="Markeret som korrekt af dig. Sagen er lukket.";c.status="done";render();toast("Markeret som korrekt.");return}
  if(a==="bad"){$("audit").innerHTML=`<span>Hvad skulle Fiks have svaret? Det gemmes som en regel, Fiks følger fremover.</span><textarea id="rule" style="min-height:64px" aria-label="Rettelse til Fiks"></textarea><button class="btn small primary" data-a="saverule" type="button">Gem som regel</button>`;$("rule").focus();return}
  if(a==="saverule"){c.audited="Rettet af dig. Reglen er gemt, og sagen ligger nu hos dig.";c.owner=ME;c.fiksDone=false;render();toast("Reglen er gemt.");return}
  if(a==="senddone"||a==="sendwait"){if(!text){$("body").focus();return}
    c.msgs.push({t:"out",who:ME,when:"nu",body:text});c.draft=null;c.need=null;c.fiksDone=false;c.owner=c.owner||ME;c.status=a==="senddone"?"done":"waiting";
    const n=c.name;next();render();toast((c.public?"Svaret er klar til at blive offentliggjort for ":"Sendes til ")+n+".",back);return}
  if(a==="done"){c.status="done";next();render();toast("Lukket.",back);return}
  if(a==="snooze"){c.status="snoozed";c.msgs.push({t:"sys",body:"Udsat til i morgen kl. 9."});next();render();toast("Udsat til i morgen kl. 9.",back);return}
}
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-v]"),s=e.target.closest("[data-s]"),i=e.target.closest("[data-id]"),a=e.target.closest("[data-a]"),m=e.target.closest("[data-m]");
  if(v){view=v.dataset.v;sel=null;app.dataset.pane="list";render()}
  else if(s){store=s.dataset.s;render()}
  else if(i)open(+i.dataset.id)
  else if(m){mode=m.dataset.m;renderThread();$("body").focus()}
  else if(a)act(a.dataset.a)
  else if(e.target.id==="helpBtn")help(true)
  else if(e.target.closest(".help")&&!e.target.closest(".help div")||e.target.id==="helpClose")help(false);
});
$("viewpick").addEventListener("change",e=>{view=e.target.value;sel=null;render()});
$("q").addEventListener("input",e=>{q=e.target.value.toLowerCase();renderList()});
document.addEventListener("change",e=>{if(e.target.id==="saved"&&e.target.value!==""){const c=C.find(x=>x.id===sel);$("body").value=SAVED[e.target.value][1].replace("{butik}",c.store).replace("{enhed}","enhed");e.target.value=""}});
function help(on){$("help").innerHTML=on?`<div class="help"><div role="dialog" aria-label="Genveje"><h3>Genveje</h3><dl><dt>J / K</dt><dd>Næste og forrige samtale</dd><dt>T</dt><dd>Tag den</dd><dt>E</dt><dd>Færdig</dd><dt>H</dt><dd>Udsæt til i morgen</dd><dt>R</dt><dd>Skriv svar</dd><dt>N</dt><dd>Intern note</dd><dt>?</dt><dd>Vis genveje</dd></dl><button class="btn" id="helpClose" type="button">Luk</button></div></div>`:""}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){help(false);if(document.activeElement)document.activeElement.blur();return}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  const r=visible(),ix=r.findIndex(c=>c.id===sel),k=e.key.toLowerCase();
  if(k==="j"&&r.length)open(r[Math.min(r.length-1,ix+1)].id);
  else if(k==="k"&&r.length)open(r[Math.max(0,ix-1)].id);
  else if(k==="t")act("take"); else if(k==="e")act("done"); else if(k==="h")act("snooze");
  else if(k==="r"&&sel){e.preventDefault();mode="reply";renderThread();$("body").focus()}
  else if(k==="n"&&sel){e.preventDefault();mode="note";renderThread();$("body").focus()}
  else if(e.key==="?")help(true);
});
sel=visible()[0]?.id??null; render(); app.dataset.pane="list";
</script>
