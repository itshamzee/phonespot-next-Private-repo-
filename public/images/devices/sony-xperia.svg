<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" fill="none">
  <!-- Sony Xperia device - tall 21:9 form factor -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="50%" stop-color="#444"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
  </defs>
  <!-- Phone body -->
  <rect x="40" y="20" width="220" height="560" rx="24" fill="url(#body)" stroke="#555" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="48" y="48" width="204" height="504" rx="16" fill="url(#screen)"/>
  <!-- Camera module (triple camera, top-left on back, visible as small bumps) -->
  <circle cx="80" cy="32" r="4" fill="#222" stroke="#555" stroke-width="0.5"/>
  <!-- Front camera -->
  <circle cx="150" cy="36" r="3" fill="#111" stroke="#333" stroke-width="0.5"/>
  <!-- Screen reflection -->
  <rect x="48" y="48" width="204" height="504" rx="16" fill="white" opacity="0.03"/>
  <!-- Side button (power/fingerprint) -->
  <rect x="260" y="200" width="3" height="40" rx="1.5" fill="#444"/>
  <!-- Volume buttons -->
  <rect x="260" y="260" width="3" height="30" rx="1.5" fill="#444"/>
  <rect x="260" y="300" width="3" height="30" rx="1.5" fill="#444"/>
  <!-- Sony logo on screen -->
  <text x="150" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="rgba(255,255,255,0.15)" letter-spacing="6">SONY</text>
</svg>
