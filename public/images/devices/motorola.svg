<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 620" fill="none">
  <!-- Motorola Edge device -->
  <defs>
    <linearGradient id="mbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#111122"/>
    </linearGradient>
    <linearGradient id="mscreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>
  <!-- Phone body with curved edges -->
  <rect x="35" y="20" width="230" height="580" rx="30" fill="url(#mbody)" stroke="#444" stroke-width="1.5"/>
  <!-- Screen - edge-to-edge with punch hole -->
  <rect x="42" y="32" width="216" height="556" rx="24" fill="url(#mscreen)"/>
  <!-- Punch-hole camera (center top) -->
  <circle cx="150" cy="52" r="5" fill="#0a0a12" stroke="#222" stroke-width="0.5"/>
  <!-- Screen reflection -->
  <rect x="42" y="32" width="216" height="556" rx="24" fill="white" opacity="0.03"/>
  <!-- Side buttons -->
  <rect x="265" y="180" width="3" height="50" rx="1.5" fill="#333"/>
  <rect x="265" y="250" width="3" height="35" rx="1.5" fill="#333"/>
  <!-- Motorola batwing hint on screen -->
  <circle cx="150" cy="310" r="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <path d="M130 310 L150 340 L170 310" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
</svg>
