<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>PhoneSpot Meta Ad — Price Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #1A3D2E;
    --charcoal: #111111;
    --sand: #F5F5F0;
    --warm-white: #FAFAF8;
    --red: #DC2626;
  }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: var(--warm-white);
    position: relative;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 64px;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 38px;
    letter-spacing: 2px;
    color: var(--green);
    text-transform: uppercase;
  }

  .warranty-badge {
    background: var(--green);
    border-radius: 100px;
    padding: 10px 28px;
    font-size: 16px;
    font-weight: 700;
    color: white;
  }

  /* Headline */
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 58px;
    line-height: 1.1;
    color: var(--charcoal);
    margin-top: 48px;
    max-width: 700px;
  }

  /* Comparison cards */
  .comparison {
    flex: 1;
    display: flex;
    gap: 32px;
    margin-top: 48px;
    align-items: stretch;
  }

  .compare-card {
    flex: 1;
    border-radius: 28px;
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }

  .compare-card.new-price {
    background: #F0F0F0;
    border: 2px solid #E0E0E0;
  }

  .compare-card.our-price {
    background: var(--green);
    border: 2px solid var(--green);
    box-shadow: 0 20px 60px rgba(26, 61, 46, 0.25);
  }

  .compare-label {
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }

  .new-price .compare-label { color: #888; }
  .our-price .compare-label { color: rgba(255,255,255,0.6); }

  .compare-card img {
    width: 200px;
    height: 150px;
    object-fit: contain;
    margin-bottom: 24px;
  }

  .our-price img {
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.2));
  }

  .compare-model {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin-bottom: 4px;
  }

  .new-price .compare-model { color: var(--charcoal); }
  .our-price .compare-model { color: white; }

  .compare-specs {
    font-size: 14px;
    margin-bottom: 20px;
  }

  .new-price .compare-specs { color: #888; }
  .our-price .compare-specs { color: rgba(255,255,255,0.6); }

  .compare-price {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    margin-top: auto;
  }

  .new-price .compare-price {
    font-size: 48px;
    color: #888;
    text-decoration: line-through;
    text-decoration-color: var(--red);
    text-decoration-thickness: 3px;
  }

  .our-price .compare-price {
    font-size: 56px;
    color: white;
  }

  .compare-price small {
    font-size: 20px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
  }

  .savings-badge {
    position: absolute;
    top: -16px;
    right: -16px;
    background: white;
    color: var(--green);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 22px;
    padding: 12px 24px;
    border-radius: 100px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }

  /* Bottom */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 40px;
    padding-top: 28px;
    border-top: 2px solid #E8E8E4;
  }

  .bottom-text {
    font-size: 18px;
    color: #666;
  }

  .bottom-text strong {
    color: var(--charcoal);
    font-weight: 700;
  }

  .cta-button {
    background: var(--green);
    color: white;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 20px;
    padding: 16px 40px;
    border-radius: 100px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="content">
  <!-- Top -->
  <div class="top-bar">
    <div class="logo">PhoneSpot</div>
    <div class="warranty-badge">36 mdr. garanti</div>
  </div>

  <!-- Headline -->
  <h1>Samme laptop. Halv pris.</h1>

  <!-- Comparison -->
  <div class="comparison">
    <div class="compare-card new-price">
      <div class="compare-label">Ny pris</div>
      <img src="https://en.foxway.dk/admin/public/getimage.ashx?Image=/Files/images/products/38/bd/38bd5eaf-b74e-420c-a1c7-370db150042a.jpg&Width=600&Height=600&Format=jpg&Quality=90&Crop=0" alt="EliteBook 840 G8">
      <div class="compare-model">HP EliteBook 840 G8</div>
      <div class="compare-specs">i5 . 16GB . 256GB SSD . 14"</div>
      <div class="compare-price">6.999<small> kr.</small></div>
    </div>

    <div class="compare-card our-price">
      <div class="savings-badge">Spar 50%</div>
      <div class="compare-label">PhoneSpot pris</div>
      <img src="https://en.foxway.dk/admin/public/getimage.ashx?Image=/Files/images/products/38/bd/38bd5eaf-b74e-420c-a1c7-370db150042a.jpg&Width=600&Height=600&Format=jpg&Quality=90&Crop=0" alt="EliteBook 840 G8">
      <div class="compare-model">HP EliteBook 840 G8</div>
      <div class="compare-specs">i5 . 16GB . 256GB SSD . 14"</div>
      <div class="compare-price">3.499<small> kr.</small></div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="bottom-bar">
    <div class="bottom-text">
      <strong>105 modeller</strong> fra 1.999 kr. Alle testet med 30+ kontroller.
    </div>
    <div class="cta-button">Se alle bærbare</div>
  </div>
</div>
</body>
</html>
