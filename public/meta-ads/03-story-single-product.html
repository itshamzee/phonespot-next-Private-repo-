<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>PhoneSpot Story Ad — Single Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #1A3D2E;
    --green-light: #2D6B45;
    --charcoal: #111111;
    --sand: #F5F5F0;
    --warm-white: #FAFAF8;
    --gold: #C4A35A;
  }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: var(--warm-white);
    position: relative;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Top section — brand green */
  .top-section {
    background: var(--green);
    padding: 80px 64px 48px;
    position: relative;
  }

  .top-section::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: var(--warm-white);
    clip-path: ellipse(60% 100% at 50% 100%);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 44px;
    letter-spacing: 2px;
    color: white;
    text-transform: uppercase;
  }

  .new-badge {
    background: var(--gold);
    color: var(--charcoal);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    padding: 10px 28px;
    border-radius: 100px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .top-headline {
    margin-top: 40px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 52px;
    color: white;
    line-height: 1.1;
  }

  .top-sub {
    margin-top: 12px;
    font-size: 22px;
    color: rgba(255,255,255,0.6);
  }

  /* Product hero */
  .product-hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 64px;
    position: relative;
  }

  .product-hero img {
    width: 580px;
    height: 420px;
    object-fit: contain;
    filter: drop-shadow(0 20px 60px rgba(0,0,0,0.15));
    margin-bottom: 40px;
  }

  .product-info {
    text-align: center;
  }

  .product-brand-line {
    font-size: 16px;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .product-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 56px;
    color: var(--charcoal);
    line-height: 1.1;
    margin-bottom: 12px;
  }

  .product-specs {
    font-size: 22px;
    color: #888;
    margin-bottom: 32px;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 20px;
  }

  .old-price {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 32px;
    color: #CCC;
    text-decoration: line-through;
  }

  .new-price {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 64px;
    color: var(--green);
  }

  .new-price small {
    font-size: 28px;
    font-weight: 600;
  }

  /* Bottom section */
  .bottom-section {
    background: var(--green);
    padding: 48px 64px;
  }

  .trust-row {
    display: flex;
    justify-content: space-between;
  }

  .trust-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 500;
    color: rgba(255,255,255,0.8);
  }

  .trust-icon {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: var(--gold);
    stroke-width: 2;
  }

  .swipe-cta {
    margin-top: 32px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: white;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .swipe-arrow {
    display: inline-block;
    margin-left: 12px;
    animation: bounce 1.5s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
</style>
</head>
<body>
<div class="content">
  <!-- Top -->
  <div class="top-section">
    <div class="top-bar">
      <div class="logo">PhoneSpot</div>
      <div class="new-badge">Nyt: Bærbare</div>
    </div>
    <div class="top-headline">Refurbished laptops<br>du kan stole på</div>
    <div class="top-sub">Testet, renset og klar med 36 mdr. garanti</div>
  </div>

  <!-- Product -->
  <div class="product-hero">
    <img src="https://en.foxway.dk/admin/public/getimage.ashx?Image=/Files/images/products/56/85/56857da9-c453-4d99-b2c5-7e6cf924d2ee.jpg&Width=600&Height=600&Format=jpg&Quality=90&Crop=0" alt="ThinkPad T14s G2">
    <div class="product-info">
      <div class="product-brand-line">Lenovo ThinkPad</div>
      <div class="product-title">T14s G2</div>
      <div class="product-specs">i5-1135G7 . 16GB . 256GB SSD . 14"</div>
      <div class="price-row">
        <div class="old-price">5.999 kr.</div>
        <div class="new-price">3.499<small> kr.</small></div>
      </div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="bottom-section">
    <div class="trust-row">
      <div class="trust-item">
        <svg class="trust-icon" viewBox="0 0 24 24"><path d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        36 mdr. garanti
      </div>
      <div class="trust-item">
        <svg class="trust-icon" viewBox="0 0 24 24"><path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        30+ tests
      </div>
      <div class="trust-item">
        <svg class="trust-icon" viewBox="0 0 24 24"><path d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" stroke-linecap="round" stroke-linejoin="round"/></svg>
        1-3 dages levering
      </div>
    </div>
    <div class="swipe-cta">
      Se alle bærbare <span class="swipe-arrow">&#8593;</span>
    </div>
  </div>
</div>
</body>
</html>
